<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام الذكي المستقبلي - نسخة واضحة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* خلفية مظلمة صلبة ومستقرة لضمان تباين عالٍ */
            background-color: #050914;
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(0, 242, 254, 0.05) 0%, transparent 30%),
                radial-gradient(circle at 80% 90%, rgba(79, 70, 229, 0.05) 0%, transparent 30%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e2e8f0; /* لون فاتح ثابت للنصوص العامة */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* خط قياسي وواضح للقراءة */
        }
        /* الهيدر المستقبلي */
        header {
            padding: 15px 30px;
            background: rgba(5, 9, 20, 0.85);
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.8);
        }
        header span {
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        /* منطقة الدردشة */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 18px 22px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.7;
            word-wrap: break-word;
            font-size: 16px; /* حجم خط أكبر قليلاً للوضوح */
            font-weight: 500; /* خط أثقل قليلاً للقراءة المريحة */
            animation: fadeIn 0.3s ease-out;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            /* تباين أعلى لخلفية المستخدم */
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.5);
            color: #ffffff; /* نص أبيض ناصع للمستخدم */
            align-self: flex-start;
        }
        .ai-message {
            /* تباين أعلى لخلفية الذكاء الاصطناعي */
            background: rgba(110, 94, 255, 0.15);
            border: 1px solid rgba(110, 94, 255, 0.5);
            color: #f1f5f9; /* نص فاتح جداً لـ AI */
            align-self: flex-end;
        }
        /* شريط الإدخال السفلي */
        .input-wrapper {
            padding: 20px 30px;
            background: rgba(5, 9, 20, 0.95);
            border-top: 1px solid rgba(0, 242, 254, 0.3);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
        }
        .input-box {
            max-width: 950px;
            width: 100%;
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 10px;
            padding: 12px 20px;
            transition: all 0.3s;
        }
        .input-box:focus-within {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff; /* نص أبيض داخل حقل الإدخال */
            resize: none;
            height: 30px;
            max-height: 150px;
            font-family: inherit;
            font-size: 17px; /* خط أكبر داخل الحقل */
            outline: none;
            padding-top: 4px;
            line-height: 1.5;
        }
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.6); /* مكان النص أوضح بتباين أكثر */
        }
        button {
            background: linear-gradient(135deg, #00f2fe, #6e5eff);
            border: none;
            border-radius: 8px;
            color: white;
            padding: 0 35px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
            transition: opacity 0.2s, box-shadow 0.2s;
        }
        button:hover {
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.7);
            opacity: 1;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div>نظام التشغيل المتطور // <span>متصل بالخادم الآمن</span></div>
        <div>[ CORE v2.5 ]</div>
    </header>

    <div class="chat-container" id="chatBox">
        <div class="message ai-message">النظام في وضع الاستعداد. كيف يمكنني بدء العمليات؟</div>
    </div>

    <div class="input-wrapper">
        <div class="input-box">
            <textarea id="userInput" placeholder="اكتب الاستعلام هنا..." rows="1"></textarea>
            <button id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

<script>
async function sendMessage() {
    const input = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const sendBtn = document.getElementById('sendBtn');
    
    const message = input.value.trim();
    if (!message) return;
    
    appendMessage(message, 'user-message');
    input.value = '';
    sendBtn.disabled = true;
    
    const loadingId = 'loading-' + Date.now();
    appendMessage('جاري معالجة البيانات...', 'ai-message', loadingId);
    
    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        });
        
        const data = await response.json();
        document.getElementById(loadingId).remove();
        
        if (response.ok) {
            appendMessage(data.reply, 'ai-message');
        } else {
            appendMessage('خطأ في النظام: ' + (data.error || 'غير معروف'), 'ai-message');
        }
    } catch (error) {
        document.getElementById(loadingId).remove();
        appendMessage('خطأ حرج في الاتصال بالخادم السحابي.', 'ai-message');
    } finally {
        sendBtn.disabled = false;
    }
}

function appendMessage(text, className, id = '') {
    const chatBox = document.getElementById('chatBox');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${className}`;
    if (id) msgDiv.id = id;
    msgDiv.innerText = text;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// إرسال عند الضغط على Enter
document.getElementById('userInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
// تحسين حجم textarea تلقائياً
document.getElementById('userInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
});
</script>

</body>
</html>
