<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My AI - العقل العميق</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --user-msg: #2563eb;
            --ai-msg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* دعم الشاشات الكاملة للموبايل */
            overflow: hidden;
        }

        /* الشريط العلوى المتجاوب */
        header {
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .logo-area {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: var(--text-color);
        }

        /* إعدادات اختيار الألوان */
        .theme-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-selector label {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .theme-selector select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        /* صندوق المحادثة الرئيسي */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--user-msg);
            color: #ffffff;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: var(--ai-msg);
            color: var(--text-color);
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }

        /* منطقة إدخال النص في الأسفل */
        .input-container {
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .input-container input {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-container input:focus {
            border-color: var(--accent-color);
        }

        .input-container button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-container button:hover {
            background-color: var(--accent-hover);
        }

        /* توافق تام مع الهواتف الصغيرة جداً */
        @media (max-width: 480px) {
            header {
                padding: 10px 12px;
            }
            .logo-area {
                font-size: 1.05rem;
            }
            .theme-selector label {
                display: none; /* إخفاء الكلمة وتوفير مساحة على الجوال */
            }
            .message {
                max-width: 92%;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي الذي يحوي الاسم واختيار الألوان -->
    <header>
        <div class="logo-area">My AI</div>
        <div class="theme-selector">
            <label for="themeSelect">اللون:</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="blue">أزرق داكن (افتراضي)</option>
                <option value="emerald">أخضر زمردي</option>
                <option value="purple">بنفسجي ملكي</option>
                <option value="dark">أسود فاحم</option>
            </select>
        </div>
    </header>

    <!-- مساحة عرض الرسائل -->
    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">أهلاً بك. أنا جاهز، اطرح ما يدور في ذهنك لنخوض في صلب الموضوع مباشرة.</div>
    </div>

    <!-- شريط الإدخال السفلي -->
    <div class="input-container">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        // دالة لتغيير الألوان عبر الـ CSS Variables
        function changeTheme(theme) {
            const root = document.documentElement;
            if (theme === 'blue') {
                root.style.setProperty('--bg-color', '#0f172a');
                root.style.setProperty('--chat-bg', '#1e293b');
                root.style.setProperty('--accent-color', '#3b82f6');
                root.style.setProperty('--accent-hover', '#2563eb');
                root.style.setProperty('--border-color', '#334155');
                root.style.setProperty('--user-msg', '#2563eb');
                root.style.setProperty('--ai-msg', '#334155');
            } else if (theme === 'emerald') {
                root.style.setProperty('--bg-color', '#064e3b');
                root.style.setProperty('--chat-bg', '#022c22');
                root.style.setProperty('--accent-color', '#10b981');
                root.style.setProperty('--accent-hover', '#059669');
                root.style.setProperty('--border-color', '#047857');
                root.style.setProperty('--user-msg', '#059669');
                root.style.setProperty('--ai-msg', '#065f46');
            } else if (theme === 'purple') {
                root.style.setProperty('--bg-color', '#2e1065');
                root.style.setProperty('--chat-bg', '#1e1b4b');
                root.style.setProperty('--accent-color', '#8b5cf6');
                root.style.setProperty('--accent-hover', '#7c3aed');
                root.style.setProperty('--border-color', '#4c1d95');
                root.style.setProperty('--user-msg', '#7c3aed');
                root.style.setProperty('--ai-msg', '#312e81');
            } else if (theme === 'dark') {
                root.style.setProperty('--bg-color', '#000000');
                root.style.setProperty('--chat-bg', '#121212');
                root.style.setProperty('--accent-color', '#525252');
                root.style.setProperty('--accent-hover', '#737373');
                root.style.setProperty('--border-color', '#262626');
                root.style.setProperty('--user-msg', '#404040');
                root.style.setProperty('--ai-msg', '#212121');
            }
            // حفظ اختيار المستخدم في الذاكرة المحلية للمتصفح
            localStorage.setItem('selected_theme', theme);
        }

        // استرجاع الثيم المحفوظ عند فتح الصفحة
        window.onload = function() {
            const savedTheme = localStorage.getItem('selected_theme');
            if (savedTheme) {
                document.getElementById('themeSelect').value = savedTheme;
                changeTheme(savedTheme);
            }
        };

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            const text = input.value.trim();

            if (!text) return;

            // إضافة رسالة المستخدم
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            container.appendChild(userDiv);

            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                // استدعاء ملف الـ API الخلفي (تأكد أن مسار الـ API صحيح حسب مشروعك)
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                aiDiv.textContent = data.reply || data.error || 'حدث خطأ في الاستجابة.';
                container.appendChild(aiDiv);
            } catch (error) {
                const errDiv = document.createElement('div');
                errDiv.className = 'message ai-message';
                errDiv.textContent = 'تعذر الاتصال بالعقل.';
                container.appendChild(errDiv);
            }

            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
