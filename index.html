<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My AI - العقل العميق</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --user-msg: #2563eb;
            --ai-msg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            /* خلفية طبيعة هادئة مع تعتيم خفيف */
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');
            background-size: cover;
            background-position: center;
        }

        header {
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .logo-area {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .selector-group select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--user-msg);
            color: #ffffff;
            align-self: flex-start;
        }

        .ai-message {
            background-color: var(--ai-msg);
            color: var(--text-color);
            align-self: flex-end;
        }

        .input-container {
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            align-items: center;
        }

        .input-container input {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-container button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .voice-btn {
            background-color: #10b981 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">My AI - الطبيعة الحية</div>
        <div class="header-controls">
            <div class="selector-group">
                <select id="modelSelect">
                    <option value="grok" selected>نموذج Grok (الافتراضي)</option>
                    <option value="google">نموذج Google</option>
                    <option value="my-ai">نموذج My AI الذاتي</option>
                </select>
            </div>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">أهلاً بك في بيئتك الهادئة. أنا جاهز لنقاش العلوم والمعارف بصوت بشري ورؤية واضحة.</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
        <button class="voice-btn" onclick="toggleVoice()" id="voiceBtn" title="قراءة الرد بصوت بشري">🔊 صوت</button>
    </div>

    <script>
        let voiceEnabled = true;

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('voiceBtn');
            btn.style.opacity = voiceEnabled ? "1" : "0.5";
            btn.textContent = voiceEnabled ? "🔊 صوت" : "🔇 صامت";
        }

        function speakText(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // إيقاف أي قراءة سابقة
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA'; // نطق عربي بشري فصيح
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            const modelSelect = document.getElementById('modelSelect');
            const text = input.value.trim();
            const selectedModel = modelSelect.value;

            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            container.appendChild(userDiv);

            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, model: selectedModel })
                });

                const data = await response.json();
                const replyText = data.reply || data.error || 'حدث خطأ في الاستجابة.';
                
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                aiDiv.textContent = replyText;
                container.appendChild(aiDiv);

                // النطق الصوتي التلقائي للإجابة بصوت يشبه الإنسان
                speakText(replyText);

            } catch (error) {
                const errDiv = document.createElement('div');
                errDiv.className = 'message ai-message';
                errDiv.textContent = 'تعذر الاتصال بالعقل.';
                container.appendChild(errDiv);
            }

            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
