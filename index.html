<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI - النظام المستقبلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-color: #050914;
            --header-bg: rgba(5, 9, 20, 0.85);
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00f2fe, #6e5eff);
            --text-color: #e2e8f0;
            --border-color: rgba(0, 242, 254, 0.3);
            --input-bg: rgba(255, 255, 255, 0.05);
        }
        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-color);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.4s ease, color 0.4s ease;
        }
        /* الهيدر */
        header {
            padding: 15px 30px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        /* زر الأشرطة الثلاثة للقائمة الجانبية */
        .menu-btn {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .menu-btn:hover {
            background: var(--accent-color);
            color: #000;
        }
        /* عنوان My AI مع الكتابة البيضاء المتوهجة */
        .ai-title {
            color: #ffffff;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px var(--accent-color);
            letter-spacing: 1.5px;
        }
        /* زر اختيار الألوان */
        .theme-selector {
            position: relative;
        }
        .palette-btn {
            background: var(--input-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .color-dropdown {
            position: absolute;
            top: 40px;
            left: 0;
            background: var(--header-bg);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
        }
        .color-option {
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            font-weight: bold;
        }
        /* القائمة الجانبية (الشريط الجانبي) */
        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: var(--header-bg);
            border-left: 1px solid var(--border-color);
            backdrop-filter: blur(15px);
            transition: right 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar.open {
            right: 0;
        }
        .sidebar h3 {
            color: var(--text-color);
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            background: var(--input-bg);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
            word-break: break-all;
            color: var(--text-color);
        }
        .history-item:hover {
            border-color: var(--accent-color);
            background: rgba(0, 242, 254, 0.1);
        }
        .sidebar-hint {
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.7;
            margin-top: 10px;
            line-height: 1.5;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
        .close-sidebar {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
            align-self: flex-end;
            margin-bottom: 10px;
        }
        /* منطقة الدردشة */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 18px 22px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.7;
            word-wrap: break-word;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .user-message {
            background: var(--input-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            align-self: flex-start;
        }
        .ai-message {
            background: var(--input-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            align-self: flex-end;
        }
        /* شريط الإدخال المرفوع قليلاً للأعلى */
        .input-wrapper {
            padding: 15px 30px 25px 30px;
            background: transparent;
            display: flex;
            justify-content: center;
        }
        .input-box {
            max-width: 950px;
            width: 100%;
            display: flex;
            gap: 20px;
            background: var(--header-bg);
            border: 1px solid var(--accent-color);
            border-radius: 14px;
            padding: 14px 22px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            resize: none;
            height: 30px;
            max-height: 150px;
            font-family: inherit;
            font-size: 17px;
            outline: none;
        }
        textarea::placeholder {
            color: var(--text-color);
            opacity: 0.5;
        }
        button.send-btn {
            background: var(--accent-gradient);
            border: none;
            border-radius: 8px;
            color: white;
            padding: 0 35px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="ai-title">My AI</div>
        </div>
        <div class="theme-selector">
            <button class="palette-btn" onclick="toggleDropdown()">🎨 الألوان والثيمات</button>
            <div class="color-dropdown" id="colorDropdown">
                <div class="color-option" style="background:#050914; color:#00f2fe;" onclick="setTheme('cyan')">أزرق سيان (الافتراضي)</div>
                <div class="color-option" style="background:#f8fafc; color:#0f172a;" onclick="setTheme('white')">أبيض ناصع (فاتح)</div>
                <div class="color-option" style="background:#022c22; color:#34d399;" onclick="setTheme('green')">أخضر سايبر</div>
            </div>
        </div>
    </header>

    <!-- الشريط الجانبي لتخزين الدردشات محلياً -->
    <div class="sidebar" id="sidebar">
        <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        <h3>سجل المحادثات (محلي)</h3>
        <div class="chat-history-list" id="historyList">
            <!-- ستضاف المحادثات هنا تلقائياً -->
        </div>
        <div class="sidebar-hint">
            ⚠️ ملاحظة هامة: اضغط مطولاً على أي موضوع أو دردشة في الشريط أدناه ليتم مشاركتها وحفظها إلى Google Drive أو OneDrive.
        </div>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="message ai-message">أهلاً بك في My AI. كيف يمكنني مساعدتك اليوم؟</div>
    </div>

    <!-- شريط الإدخال المرفوع قليلاً للأعلى -->
    <div class="input-wrapper">
        <div class="input-box">
            <textarea id="userInput" placeholder="اكتب استعلامك هنا..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        loadHistory();
    }

    function toggleDropdown() {
        const drop = document.getElementById('colorDropdown');
        drop.style.display = drop.style.display === 'flex' ? 'none' : 'flex';
    }

    function setTheme(theme) {
        let bgColor, headerBg, accent, textCol, borderCol, inputBg, gradient;

        if (theme === 'cyan') {
            bgColor = '#050914';
            headerBg = 'rgba(5, 9, 20, 0.85)';
            accent = '#00f2fe';
            textCol = '#e2e8f0';
            borderCol = 'rgba(0, 242, 254, 0.3)';
            inputBg = 'rgba(255, 255, 255, 0.05)';
            gradient = 'linear-gradient(135deg, #00f2fe, #6e5eff)';
        } else if (theme === 'white') {
            bgColor = '#f4f6f9';
            headerBg = 'rgba(255, 255, 255, 0.9)';
            accent = '#2563eb';
            textCol = '#1e293b';
            borderCol = 'rgba(37, 99, 235, 0.2)';
            inputBg = 'rgba(0, 0, 0, 0.03)';
            gradient = 'linear-gradient(135deg, #2563eb, #7c3aed)';
        } else if (theme === 'green') {
            bgColor = '#021510';
            headerBg = 'rgba(2, 21, 16, 0.9)';
            accent = '#10b981';
            textCol = '#ecfdf5';
            borderCol = 'rgba(16, 185, 129, 0.3)';
            inputBg = 'rgba(255, 255, 255, 0.05)';
            gradient = 'linear-gradient(135deg, #10b981, #047857)';
        }

        const root = document.documentElement;
        root.style.setProperty('--bg-color', bgColor);
        root.style.setProperty('--header-bg', headerBg);
        root.style.setProperty('--accent-color', accent);
        root.style.setProperty('--text-color', textCol);
        root.style.setProperty('--border-color', borderCol);
        root.style.setProperty('--input-bg', inputBg);
        root.style.setProperty('--accent-gradient', gradient);

        toggleDropdown();
    }

    function saveToLocalHistory(text) {
        let history = JSON.parse(localStorage.getItem('myAiHistory') || '[]');
        history.unshift(text);
        if (history.length > 20) history.pop();
        localStorage.setItem('myAiHistory', JSON.stringify(history));
    }

    function loadHistory() {
        const list = document.getElementById('historyList');
        let history = JSON.parse(localStorage.getItem('myAiHistory') || '[]');
        list.innerHTML = '';
        if (history.length === 0) {
            list.innerHTML = '<div style="opacity:0.5; font-size:13px; text-align:center;">لا توجد محادثات محفوظة بعد</div>';
            return;
        }
        history.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerText = item;
            
            let pressTimer;
            div.addEventListener('mousedown', () => {
                pressTimer = setTimeout(() => shareToCloud(item), 800);
            });
            div.addEventListener('mouseup', () => clearTimeout(pressTimer));
            div.addEventListener('touchstart', () => {
                pressTimer = setTimeout(() => shareToCloud(item), 800);
            });
            div.addEventListener('touchend', () => clearTimeout(pressTimer));

            list.appendChild(div);
        });
    }

    function shareToCloud(text) {
        if (navigator.share) {
            navigator.share({
                title: 'محادثة My AI',
                text: text,
            }).catch(() => {});
        } else {
            const choice = confirm(`هل تريد مشاركة هذه المحادثة وحفظها؟\n\n"${text}"\n\nاضغط موافق لنسخها ومشاركة الرابط إلى Google Drive أو OneDrive.`);
            if (choice) {
                navigator.clipboard.writeText(text);
                alert('تم نسخ المحادثة بنجاح! يمكنك الآن لصقها في Google Drive أو OneDrive.');
            }
        }
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        
        const message = input.value.trim();
        if (!message) return;
        
        appendMessage(message, 'user-message');
        saveToLocalHistory(message);
        input.value = '';
        sendBtn.disabled = true;
        
        const loadingId = 'loading-' + Date.now();
        appendMessage('جاري معالجة البيانات...', 'ai-message', loadingId);
        
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            
            const data = await response.json();
            document.getElementById(loadingId).remove();
            
            if (response.ok) {
                appendMessage(data.reply, 'ai-message');
            } else {
                appendMessage('خطأ في النظام: ' + (data.error || 'غير معروف'), 'ai-message');
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage('عذراً، واجهنا ضغطاً مفاجئاً في الاتصال. يرجى الانتظار قليلاً.', 'ai-message');
        } finally {
            sendBtn.disabled = false;
        }
    }

    function appendMessage(text, className, id = '') {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        if (id) msgDiv.id = id;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('userInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    
    document.getElementById('userInput').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });
</script>

</body>
</html>
