<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My AI - العقل العميق والطبيعة الحية</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --user-msg: #2563eb;
            --ai-msg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            /* خلفية طبيعة هادئة مع تعتيم خفيف */
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');
            background-size: cover;
            background-position: center;
        }

        header {
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .logo-area {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .selector-group select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--user-msg);
            color: #ffffff;
            align-self: flex-start;
        }

        .ai-message {
            background-color: var(--ai-msg);
            color: var(--text-color);
            align-self: flex-end;
        }

        .input-container {
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            align-items: center;
        }

        .input-container input {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-container button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .mic-btn {
            background-color: #ef4444 !important; /* لون مميز لزر الميكروفون */
        }

        .mic-btn.recording {
            background-color: #22c55e !important; /* يتحول للأخضر أثناء التسجيل */
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .voice-btn {
            background-color: #10b981 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">My AI - الصوت والطبيعة</div>
        <div class="header-controls">
            <div class="selector-group">
                <select id="modelSelect">
                    <option value="grok" selected>نموذج Grok (الافتراضي)</option>
                    <option value="google">نموذج Google</option>
                    <option value="my-ai">نموذج My AI (الذاتي والمطور)</option>
                </select>
            </div>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">أهلاً بك في بيئتك الهادئة. يمكنك الكتابة أو الضغط على زر الميكروفون للتحدث بصوتك مباشرة وسأقوم بالرد عليك كتابةً وصوتاً.</div>
    </div>

    <div class="input-container">
        <!-- زر الميكروفون مع طلب صلاحية التسجيل -->
        <button class="mic-btn" id="micBtn" onclick="toggleSpeechRecognition()" title="التحدث بالصوت">🎙️</button>
        <input type="text" id="userInput" placeholder="اكتب رسالتك أو تحدث بالصوت..." onkeydown="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
        <button class="voice-btn" onclick="toggleVoice()" id="voiceBtn" title="قراءة الرد بصوت بشري">🔊 صوت</button>
    </div>

    <script>
        let voiceEnabled = true;
        let recognition = null;
        let isRecording = false;

        // إعداد ميزة تحويل الصوت إلى نص (Speech-to-Text)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA'; // اللغة العربية
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isRecording = true;
                const micBtn = document.getElementById('micBtn');
                micBtn.classList.add('recording');
                micBtn.textContent = '🔴';
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                sendMessage(); // إرسال الرسالة تلقائياً بعد انتهاء الكلام
            };

            recognition.onerror = function(event) {
                stopRecording();
            };

            recognition.onend = function() {
                stopRecording();
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert('متصفحك لا يدعم التحويل الصوتي المباشر، يرجى استخدام متصفح حديث مثل كروم.');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                // طلب السماح بالوصول للميكروفون وبدء الاستماع
                try {
                    recognition.start();
                } catch (e) {
                    stopRecording();
                }
            }
        }

        function stopRecording() {
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.remove('recording');
            micBtn.textContent = '🎙️';
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('voiceBtn');
            btn.style.opacity = voiceEnabled ? "1" : "0.5";
            btn.textContent = voiceEnabled ? "🔊 صوت" : "🔇 صامت";
        }

        function speakText(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            const modelSelect = document.getElementById('modelSelect');
            const text = input.value.trim();
            const selectedModel = modelSelect.value;

            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            container.appendChild(userDiv);

            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, model: selectedModel })
                });

                const data = await response.json();
                const replyText = data.reply || data.error || 'حدث خطأ في الاستجابة.';
                
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                aiDiv.textContent = replyText;
                container.appendChild(aiDiv);

                speakText(replyText);

            } catch (error) {
                const errDiv = document.createElement('div');
                errDiv.className = 'message ai-message';
                errDiv.textContent = 'تعذر الاتصال بالعقل.';
                container.appendChild(errDiv);
            }

            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
