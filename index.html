<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Search - المحرك الدلالي</title>
    <!-- مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #475569;
            --result-bg: rgba(51, 65, 85, 0.85);
            --input-bg: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        h1 { margin-bottom: 20px; font-size: 2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .search-box-container { width: 100%; max-width: 700px; display: flex; gap: 10px; margin-bottom: 30px; }
        .search-box-container input { flex: 1; background-color: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 14px 20px; border-radius: 12px; font-size: 1.1rem; outline: none; }
        .search-box-container button { background-color: var(--accent-color); color: #fff; border: none; padding: 14px 28px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .toggle-add-btn { background-color: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 20px; font-size: 1rem; }
        .add-info-panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; width: 100%; max-width: 700px; margin-bottom: 30px; display: none; flex-direction: column; gap: 15px; backdrop-filter: blur(5px); }
        .add-info-panel.show { display: flex; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.9rem; color: #94a3b8; }
        .add-info-panel input, .add-info-panel select, .add-info-panel textarea { background-color: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; outline: none; font-size: 1rem; }
        .add-info-panel textarea { resize: vertical; min-height: 100px; }
        .submit-info-btn { background-color: #059669; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .results-container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 15px; }
        .result-item { background-color: var(--result-bg); padding: 20px; border-radius: 12px; border-right: 5px solid var(--accent-color); line-height: 1.6; }
        .result-tag { display: inline-block; background-color: #0f172a; color: #6ee7b7; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin-bottom: 8px; }
        .result-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; display: block; }
        .no-result { color: #94a3b8; text-align: center; margin-top: 30px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <h1>My Search - المحرك الدلالي</h1>

    <button class="toggle-add-btn" onclick="toggleAddPanel()">➕ إضافة معلومة لموقع My Search</button>

    <div class="add-info-panel" id="addPanel">
        <h3>إضافة معلومة جديدة إلى جدول information</h3>
        <div class="form-group">
            <label>التصنيف (category):</label>
            <select id="infoCategory">
                <option value="عامة">عامة</option>
                <option value="زراعة">زراعة</option>
                <option value="صناعة">صناعة</option>
                <option value="تكنولوجيا">تكنولوجيا</option>
                <option value="علوم">علوم</option>
                <option value="تاريخ">تاريخ</option>
                <option value="أحكام شرعية">أحكام شرعية</option>
            </select>
        </div>
        <div class="form-group">
            <label>عنوان المعلومة / السؤال (title):</label>
            <input type="text" id="infoTitle" placeholder="اكتب العنوان هنا...">
        </div>
        <div class="form-group">
            <label>المعلومة / النص (snippet):</label>
            <textarea id="infoSnippet" placeholder="اكتب التفاصيل هنا..."></textarea>
        </div>
        <button class="submit-info-btn" onclick="addNewInformation()">حفظ في My Search</button>
    </div>

    <div class="search-box-container">
        <input type="text" id="searchInput" placeholder="Search" oninput="debounceSearch()">
        <button onclick="performSemanticSearch()">بحث</button>
    </div>

    <div class="results-container" id="resultsContainer">
        <div class="no-result">ابدأ البحث الدلالي في قاعدة البيانات...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lzvtnfdgynwczrkwlwhf.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI'; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleAddPanel() {
            document.getElementById('addPanel').classList.toggle('show');
        }

        async function addNewInformation() {
            const category = document.getElementById('infoCategory').value;
            const title = document.getElementById('infoTitle').value.trim();
            const snippet = document.getElementById('infoSnippet').value.trim();

            if (!title || !snippet) {
                alert('يرجى ملء خانة العنوان والمعلومة.');
                return;
            }

            const { error } = await supabaseClient
                .from('information')
                .insert([{ category, title, snippet }]);

            if (error) {
                alert('حدث خطأ أثناء الإضافة: ' + error.message);
                return;
            }

            alert('تمت إضافة المعلومة إلى My Search بنجاح!');
            document.getElementById('infoTitle').value = '';
            document.getElementById('infoSnippet').value = '';
            toggleAddPanel();
            performSemanticSearch();
        }

        let searchTimeout;
        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                performSemanticSearch();
            }, 400);
        }

        async function performSemanticSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('resultsContainer');
            
            if (!query) {
                container.innerHTML = '<div class="no-result">الرجاء إدخال نص للبحث.</div>';
                return;
            }

            container.innerHTML = '<div class="no-result">جاري البحث في قاعدة البيانات...</div>';

            const { data: informationTable, error } = await supabaseClient
                .from('information')
                .select('*');

            if (error) {
                container.innerHTML = '<div class="no-result">خطأ في الاتصال بقاعدة البيانات: ' + error.message + '</div>';
                return;
            }

            if (!informationTable || informationTable.length === 0) {
                container.innerHTML = '<div class="no-result">جدول المعلومات فارغ حالياً.</div>';
                return;
            }

            const queryWords = query.split(/\s+/).filter(w => w.length > 0);

            const scoredResults = informationTable.map(item => {
                let score = 0;
                const tText = (item.title || '').toLowerCase();
                const sText = (item.snippet || '').toLowerCase();
                const cText = (item.category || '').toLowerCase();

                queryWords.forEach(word => {
                    if (tText.includes(word)) score += 10;
                    if (sText.includes(word)) score += 3;
                    if (cText.includes(word)) score += 5;
                });

                return { item, score };
            }).filter(res => res.score > 0);

            scoredResults.sort((a, b) => b.score - a.score);
            const topResults = scoredResults.slice(0, 30);

            container.innerHTML = '';
            if (topResults.length === 0) {
                container.innerHTML = '<div class="no-result">لا توجد نتائج مطابقة دلالياً.</div>';
                return;
            }

            topResults.forEach(res => {
                const item = res.item;
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <span class="result-tag">${item.category || 'عامة'}</span>
                    <strong class="result-title">${item.title}</strong>
                    <p>${item.snippet}</p>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
