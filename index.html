<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Search - محرك البحث المحلي</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #334155;
            --result-bg: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');
            background-size: cover;
            background-position: center;
        }

        h1 { margin-bottom: 20px; font-size: 1.8rem; }

        .search-box-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box-container input {
            flex: 1;
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .search-box-container button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* لوحة إضافة معلومات جديدة لجدول information */
        .add-info-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .add-info-panel h3 { font-size: 1.1rem; }
        .add-info-panel input {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }

        .add-btn {
            background-color: #10b981 !important;
        }

        /* نتائج البحث */
        .results-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-item {
            background-color: var(--result-bg);
            padding: 14px;
            border-radius: 8px;
            border-right: 4px solid var(--accent-color);
            line-height: 1.4;
        }

        .no-result {
            color: #94a3b8;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>My Search - المحرك المحلي</h1>

    <!-- شريط البحث -->
    <div class="search-box-container">
        <input type="text" id="searchInput" placeholder="ابحث في جدول المعلومات..." onkeyup="performSearch()">
        <button onclick="performSearch()">بحث</button>
    </div>

    <!-- لوحة إضافة معلومة جديدة لجدول information -->
    <div class="add-info-panel">
        <h3>إضافة معلومة جديدة إلى جدول (information)</h3>
        <input type="text" id="infoTitle" placeholder="عنوان المعلومة أو الكلمات المفتاحية...">
        <input type="text" id="infoContent" placeholder="تفاصيل المعلومة...">
        <button class="add-btn" onclick="addNewInformation()">إضافة للجدول</button>
    </div>

    <!-- عرض النتائج -->
    <div class="results-container" id="resultsContainer">
        <div class="no-result">ابدأ البحث أو أضف معلومات جديدة للجدول...</div>
    </div>

    <script>
        // جدول معلومات محلي مبدئي (information table)
        let informationTable = [
            { title: "البرمجة", content: "البرمجة هي كتابة تعليمات وتوجيهات لجهاز الكمبيوتر لتنفيذ مهام محددة." },
            { title: "التاريخ", content: "التاريخ هو دراسة الأحداث الماضية المرتبطة بالإنسان والزمن." },
            { title: "العلوم", content: "العلوم هي أبنية معرفية منظمة تقوم على التجربة والملاحظة لفهم الظواهر." }
        ];

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            if (!query) {
                container.innerHTML = '<div class="no-result">الرجاء إدخال كلمة للبحث في الجدول.</div>';
                return;
            }

            // تصفية الجدول (information) بناءً على البحث
            const matchedResults = informationTable.filter(item => 
                item.title.toLowerCase().includes(query) || item.content.toLowerCase().includes(query)
            );

            if (matchedResults.length === 0) {
                container.innerHTML = '<div class="no-result">لا توجد نتائج مطابقة في جدول المعلومات. يمكنك إضافتها عبر لوحة الإضافة بالأعلى.</div>';
                return;
            }

            // عرض النتائج
            matchedResults.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `<strong>${item.title}:</strong> ${item.content}`;
                container.appendChild(div);
            });
        }

        function addNewInformation() {
            const titleInput = document.getElementById('infoTitle');
            const contentInput = document.getElementById('infoContent');
            
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!title || !content) {
                alert('يرجى ملء حقل العنوان وحقل التفاصيل معاً.');
                return;
            }

            // إضافة العنصر الجديد إلى جدول information
            informationTable.push({ title: title, content: content });

            // تفريغ الحقول بعد الإضافة
            titleInput.value = '';
            contentInput.value = '';

            alert('تمت إضافة المعلومة إلى جدول (information) بنجاح!');
        }
    </script>
</body>
</html>
