<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-ai-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 25vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            z-index: 0;
            user-select: none;
            letter-spacing: -10px;
            pointer-events: none;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            z-index: 1;
            position: relative;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            background: rgba(31, 41, 55, 0.4);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .chat-header h1 {
            font-size: 1.25rem;
            color: #60a5fa;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            background: #2563eb;
            color: #ffffff;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .message.bot {
            background: #1f2937;
            color: #e5e7eb;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(31, 41, 55, 0.4);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .chat-input-area button {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .chat-input-area button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="bg-ai-watermark">AI</div>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Autonomous AI Assistant</h1>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">مرحباً بك! أنا نظام الذكاء الاصطناعي الخاص بك، كيف يمكنني مساعدتك اليوم؟</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: text })
            })
            .then(response => response.json())
            .then(data => {
                const reply = data.reply || data.response || "تم استلام الرد بنجاح.";
                appendMessage(reply, 'bot');
            })
            .catch(error => {
                console.error('Error:', error);
                appendMessage("عذراً، حدث خطأ في الاتصال بالسيرفر المحلي.", 'bot');
            });
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
</html>
