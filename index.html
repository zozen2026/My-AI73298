<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي (Google Gemini)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent-color: #4285F4; /* لون جوجل المميز */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .chat-header {
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }
        .chat-header h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--accent-color);
        }
        .api-config {
            margin-top: 8px;
            font-size: 0.85rem;
        }
        .api-config input {
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            width: 70%;
            outline: none;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .message.user {
            background: rgba(66, 133, 244, 0.2);
            align-self: flex-start;
            border: 1px solid rgba(66, 133, 244, 0.3);
        }
        .message.ai {
            background: rgba(255, 255, 255, 0.07);
            align-self: flex-end;
            border: 1px solid var(--border-color);
        }
        .chat-input-area {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
        }
        input, button {
            font-family: inherit;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: var(--accent-color);
        }
        .chat-input-area button {
            padding: 0 20px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h3>مساعد جوجل الذكي (Google Gemini API)</h3>
            <div class="api-config">
                <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح Gemini API هنا...">
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">مرحباً! ضع مفتاح Google Gemini API في الأعلى وابدأ التحدث معي فوراً.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const messagesContainer = document.getElementById('chatMessages');
            
            const text = inputField.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            if (!apiKey) {
                alert("الرجاء إدخال مفتاح Google Gemini API أولاً في الحقل بالأعلى!");
                return;
            }

            // إضافة رسالة المستخدم
            messagesContainer.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            inputField.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // إضافة رسالة الانتظار
            const aiMsgId = 'ai-msg-' + Date.now();
            messagesContainer.innerHTML += `<div class="message ai" id="${aiMsgId}">جاري التفكير عبر جوجل...</div>`;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                // استدعاء نموذج Gemini 1.5 Flash السريع والمجاني من جوجل
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: text }]
                        }]
                    })
                });

                const data = await response.json();
                const aiMsgElement = document.getElementById(aiMsgId);

                if (data.candidates && data.candidates.length > 0) {
                    const replyText = data.candidates[0].content.parts[0].text;
                    aiMsgElement.innerText = replyText;
                } else if (data.error) {
                    aiMsgElement.innerText = "خطأ من جوجل: " + data.error.message;
                } else {
                    aiMsgElement.innerText = "عذراً، لم يتم تلقي رد صحيح.";
                }
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

            } catch (error) {
                document.getElementById(aiMsgId).innerText = "حدث خطأ في الاتصال بشبكة جوجل.";
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
