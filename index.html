<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Search - المحرك الدلالي الذكي (Vector Engine)</title>

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- مكتبة تحويل النصوص إلى متجهات رياضية مباشرة في المتصفح -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';
        env.allowLocalModels = false;
        
        window.getEmbeddingPipeline = async () => {
            if (!window.extractor) {
                window.extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
            }
            return window.extractor;
        };
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #475569;
            --result-bg: rgba(51, 65, 85, 0.85);
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-align: center;
        }

        .status-bar {
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            color: #38bdf8;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .toggle-add-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .toggle-add-btn:hover {
            background-color: #059669;
        }

        .add-info-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 25px;
            display: none;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(8px);
        }

        .add-info-panel.show {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .add-info-panel input, .add-info-panel select, .add-info-panel textarea {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }

        .add-info-panel textarea {
            resize: vertical;
            min-height: 90px;
        }

        .submit-info-btn {
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.05rem;
        }

        .search-box-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box-container input {
            flex: 1;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1.05rem;
            outline: none;
        }

        .search-box-container button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            white-space: nowrap;
        }

        .results-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-item {
            background-color: var(--result-bg);
            padding: 20px;
            border-radius: 12px;
            border-right: 5px solid var(--accent-color);
            line-height: 1.6;
            backdrop-filter: blur(5px);
        }

        .result-tag {
            display: inline-block;
            background-color: #0f172a;
            color: #6ee7b7;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .result-title {
            font-weight: bold;
            font-size: 1.25rem;
            margin-bottom: 8px;
            display: block;
            color: #60a5fa;
        }

        .no-result {
            color: #94a3b8;
            text-align: center;
            margin-top: 20px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h1>My Search - المحرك الدلالي الذكي</h1>
    <div class="status-bar" id="status">جاري تهيئة المحرك الرياضي...</div>

    <button class="toggle-add-btn" onclick="toggleAddPanel()">➕ إضافة معلومة جديدة</button>

    <div class="add-info-panel" id="addPanel">
        <h3>إضافة معلومة وتحويلها دلالياً إلى متجه رياضي</h3>
        <div class="form-group">
            <label>التصنيف:</label>
            <select id="infoCategory">
                <option value="عامة">عامة</option>
                <option value="زراعة">زراعة</option>
                <option value="صناعة">صناعة</option>
                <option value="تكنولوجيا">تكنولوجيا</option>
                <option value="علوم">علوم</option>

                <option value="تاريخ">تاريخ</option>
                <option value="أحكام شرعية">أحكام شرعية</option>
            </select>
        </div>
        <div class="form-group">
            <label>العنوان / السؤال الاصلي:</label>
            <input type="text" id="infoTitle" placeholder="مثال: كيفية زراعة الطماطم">
        </div>
        <div class="form-group">
            <label>المعلومة / التفاصيل:</label>
            <textarea id="infoSnippet" placeholder="اكتب التفاصيل الكاملة هنا..."></textarea>
        </div>
        <button class="submit-info-btn" onclick="addNewInformation()">حفظ وتحويل دلالي</button>
    </div>

    <div class="search-box-container">
        <input type="text" id="searchInput" placeholder="ابحث على النية (بأي صياغة، خطأ إملائي، أو جملة طويلة/قصيرة)...">
        <button onclick="performVectorSearch()">بحث دلالي</button>
    </div>

    <div class="results-container" id="resultsContainer">
        <div class="no-result">اكتب نيتك في مربع البحث لجلب المعلومة المطلوبة...</div>
    </div>

    <script>
        // 1. الإعدادات والاتصال المباشر
        const SUPABASE_URL = 'https://lzvtnfdgynwczrkwlwhf.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI'; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. تحويل النص لمتجه
        async function generateVector(text) {
            const pipe = await window.getEmbeddingPipeline();
            const output = await pipe(text, { pooling: 'mean', normalize: true });
            return Array.from(output.data);
        }

        // 3. تهيئة الصفحة
        window.addEventListener('load', async () => {
            try {
                await window.getEmbeddingPipeline();
                document.getElementById('status').innerText = 'المحرك الرياضي جاهز لاستقبال البحث والإضافة!';
            } catch (err) {
                document.getElementById('status').innerText = 'حدث خطأ في تحميل نموذج المتجهات: ' + err.message;
            }
        });

        function toggleAddPanel() {
            document.getElementById('addPanel').classList.toggle('show');
        }

        // 4. حفظ المعلومة
        async function addNewInformation() {
            const category = document.getElementById('infoCategory').value;
            const title = document.getElementById('infoTitle').value.trim();
            const snippet = document.getElementById('infoSnippet').value.trim();

            if (!title || !snippet) {
                alert('يرجى كتابة العنوان والنص.');
                return;
            }

            document.getElementById('status').innerText = 'جاري تحويل النص دلالياً إلى متجه رياضي...';

            try {
                const textToVectorize = `${title} ${snippet}`;
                const vector = await generateVector(textToVectorize);

                const { error } = await supabaseClient
                    .from('information')
                    .insert([{ category, title, snippet, embedding: vector }]);

                if (error) {
                    alert('حدث خطأ أثناء الحفظ: ' + error.message);
                } else {
                    alert('تم حفظ المعلومة وتحويلها دلالياً بنجاح!');
                    document.getElementById('infoTitle').value = '';
                    document.getElementById('infoSnippet').value = '';
                    toggleAddPanel();
                }
            } catch (err) {
                alert('خطأ أثناء المعالجة: ' + err.message);
            }

            document.getElementById('status').innerText = 'المحرك الرياضي جاهز!';
        }

        // 5. تنفيذ البحث
        async function performVectorSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('resultsContainer');

            if (!query) {
                container.innerHTML = '<div class="no-result">اكتب نيتك في مربع البحث...</div>';
                return;
            }

            container.innerHTML = '<div class="no-result">جاري تحليل النية دلالياً ومطابقة المتجهات...</div>';

            try {
                const queryVector = await generateVector(query);

                // استدعاء دالة الـ RPC
                const { data, error } = await supabaseClient
                    .rpc('search_vector_information', {
                        query_embedding: queryVector,
                        match_threshold: 0.15,
                        match_count: 1
                    });

                if (error) {
                    container.innerHTML = `<div class="no-result">خطأ في استعلام البيانات: ${error.message}</div>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="no-result">لم نجد معلومة مطابقة لنيتك في قاعدة البيانات.</div>';
                    return;
                }

                const match = data[0];
                container.innerHTML = `
                    <div class="result-item">
                        <span class="result-tag">${match.category || 'عامة'}</span>
                        <strong class="result-title">${match.title}</strong>
                        <p>${match.snippet}</p>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<div class="no-result">خطأ غير متوقع: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
